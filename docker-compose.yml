services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MIGRATIONS_DIR: /migrations
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      PORT: "8080"
      GIN_MODE: release
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-puntazo}
      QR_PEPPER: ${QR_PEPPER:?QR_PEPPER is required}
      DEMO_SIGNUP_ENABLED: ${DEMO_SIGNUP_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8081}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-disabled}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Puntazo}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      MAIL_POLL_INTERVAL_SECONDS: ${MAIL_POLL_INTERVAL_SECONDS:-5}
      OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY:-}
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_COMMIT: ${GIT_COMMIT:-0000000}
      EXPECTED_SCHEMA_VERSION: ${EXPECTED_SCHEMA_VERSION:-0019}
      MERCADO_PAGO_PROVIDER: ${MERCADO_PAGO_PROVIDER:-disabled}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_API_URL: ${MERCADO_PAGO_API_URL:-https://api.mercadopago.com}
      MERCADO_PAGO_BRANCH_PRICE_CENTS: ${MERCADO_PAGO_BRANCH_PRICE_CENTS:-1500000}
      MERCADO_PAGO_POINTS_BRANCH_PRICE_CENTS: ${MERCADO_PAGO_POINTS_BRANCH_PRICE_CENTS:-2000000}
      MERCADO_PAGO_TIMEOUT_MS: ${MERCADO_PAGO_TIMEOUT_MS:-10000}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-disabled}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-AES256}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-300}
      MEDIA_CLEANUP_INTERVAL_SECONDS: ${MEDIA_CLEANUP_INTERVAL_SECONDS:-60}
      MEDIA_UPLOAD_GLOBAL_CONCURRENCY: ${MEDIA_UPLOAD_GLOBAL_CONCURRENCY:-8}
      MEDIA_UPLOAD_ACTOR_CONCURRENCY: ${MEDIA_UPLOAD_ACTOR_CONCURRENCY:-2}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-300}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-500}
      PREVIEW_RETENTION_HOURS: ${PREVIEW_RETENTION_HOURS:-168}
      IDEMPOTENCY_RETENTION_HOURS: ${IDEMPOTENCY_RETENTION_HOURS:-720}
      SESSION_RETENTION_HOURS: ${SESSION_RETENTION_HOURS:-720}
      IDENTITY_TOKEN_RETENTION_HOURS: ${IDENTITY_TOKEN_RETENTION_HOURS:-168}
      OUTBOX_REDACT_AFTER_HOURS: ${OUTBOX_REDACT_AFTER_HOURS:-168}
      OUTBOX_RETENTION_HOURS: ${OUTBOX_RETENTION_HOURS:-720}
      RATE_LIMIT_PROVIDER: ${RATE_LIMIT_PROVIDER:-memory}
      REDIS_URL: ${REDIS_URL:-}
      RATE_LIMIT_PREFIX: ${RATE_LIMIT_PREFIX:-puntazo:development}
      RATE_LIMIT_TIMEOUT_MS: ${RATE_LIMIT_TIMEOUT_MS:-200}
      RATE_LIMIT_DEV_FALLBACK: ${RATE_LIMIT_DEV_FALLBACK:-false}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/health/live >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
