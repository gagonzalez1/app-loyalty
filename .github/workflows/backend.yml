name: Backend

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - ".github/workflows/deploy-production.yml"
      - "ops/**"
      - ".github/workflows/deploy-testing.yml"
      - "scripts/stress-remediation/Dockerfile.monitor"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "openapi.yaml"
  push:
    branches: [main, testing, develop]
    paths:
      - ".github/workflows/backend.yml"
      - ".github/workflows/deploy-production.yml"
      - "ops/**"
      - ".github/workflows/deploy-testing.yml"
      - "scripts/stress-remediation/Dockerfile.monitor"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "openapi.yaml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: puntazo_test
          POSTGRES_USER: puntazo_test
          POSTGRES_PASSWORD: puntazo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puntazo_test -d puntazo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://puntazo_test:puntazo_test_password@127.0.0.1:5432/puntazo_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://puntazo_test:puntazo_test_password@127.0.0.1:5432/puntazo_test?sslmode=disable
      GOTOOLCHAIN: auto
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check readiness monitor image changes
        id: monitor_changes
        env:
          MONITOR_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$MONITOR_DIFF_BASE" || "$MONITOR_DIFF_BASE" =~ ^0+$ ]] ||
            ! git diff --quiet "$MONITOR_DIFF_BASE" "$GITHUB_SHA" -- scripts/stress-remediation/Dockerfile.monitor; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify readiness monitor image
        if: steps.monitor_changes.outputs.changed == 'true'
        run: |
          docker build --pull --file scripts/stress-remediation/Dockerfile.monitor --tag puntazo-readiness-monitor:ci .
          docker run --rm --network none --memory 128m --cpus 0.5 --entrypoint node puntazo-readiness-monitor:ci --version | grep -x 'v22.23.4'
          docker run --rm --network none --memory 128m --cpus 0.5 \
            --volume "$PWD/scripts/stress-remediation:/monitor:ro" \
            --entrypoint node puntazo-readiness-monitor:ci \
            --test /monitor/guards.test.js /monitor/monitor-health.test.mjs

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Test production release safety
        run: |
          python3 -m unittest discover -s ops -p 'test_production_release.py' -v
          python3 ops/production_release.py --check-migrations migrations

      - name: Vet
        run: go vet ./...

      - name: Apply migrations twice
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate up

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Audit reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.20.3 lint openapi.yaml

      - name: Build runtime image
        run: |
          chmod 0700 migrations
          chmod 0600 migrations/*.sql
          docker build --target api --tag puntazo-api:ci .

      - name: Verify migration files as the runtime user
        run: |
          docker build --target migrate --tag puntazo-migrate:ci .
          for image in puntazo-api:ci puntazo-migrate:ci; do
            docker run --rm --entrypoint sh "$image" -ec '
              test "$(id -u)" -ne 0
              test -x /migrations
              for migration in /migrations/*.sql; do
                test -f "$migration"
                test -r "$migration"
              done
            '
          done

      - name: Rehearse production release on isolated PostgreSQL
        run: python3 ops/test_production_release_integration.py --image puntazo-api:ci
