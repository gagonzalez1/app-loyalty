name: Backend

on:
  workflow_call:
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - ".github/workflows/deploy-testing.yml"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "openapi.yaml"
  push:
    branches: [main, testing]
    paths:
      - ".github/workflows/backend.yml"
      - ".github/workflows/deploy-testing.yml"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "openapi.yaml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: puntazo_test
          POSTGRES_USER: puntazo_test
          POSTGRES_PASSWORD: puntazo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puntazo_test -d puntazo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://puntazo_test:puntazo_test_password@127.0.0.1:5432/puntazo_test?sslmode=disable
      TEST_DATABASE_URL: postgresql://puntazo_test:puntazo_test_password@127.0.0.1:5432/puntazo_test?sslmode=disable
      GOTOOLCHAIN: auto
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Apply migrations twice
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate up

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Audit reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.20.3 lint openapi.yaml

      - name: Build runtime image
        run: docker build --target api --tag puntazo-api:ci .
