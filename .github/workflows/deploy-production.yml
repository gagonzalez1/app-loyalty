name: Deploy backend to Puntazo production

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/stress-remediation/Dockerfile.monitor'
  workflow_dispatch:
    inputs:
      check_only:
        description: Verify source and CI without changing production
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel the process coordinating a live database migration.
concurrency:
  group: puntazo-api-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/backend.yml

  deploy:
    name: Deploy and verify production
    if: >-
      github.repository == 'am-p/app-loyalty' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || !inputs.check_only)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Confirm current remote main and clean source
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Back up, rehearse, migrate, deploy and verify on the VPS
        env:
          PUNTAZO_PRODUCTION_SSH_KEY: ${{ secrets.PUNTAZO_PRODUCTION_SSH_KEY }}
          PUNTAZO_PRODUCTION_SSH_HOST: ${{ vars.PUNTAZO_PRODUCTION_SSH_HOST }}
        run: python3 ops/deploy_production.py
