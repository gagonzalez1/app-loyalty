        points_redeemed: { type: integer, format: int64, minimum: 0 }
        last_movement_at: { type: [string, 'null'], format: date-time }
    OperationalSummaryEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/OperationalSummary' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    CalendarMetricsBucket:
      type: object
      additionalProperties: false
      required: [label, accumulations, redemptions]
      properties:
        label: { type: string, description: 'HH:00 para day; YYYY-MM-DD para week/month' }
        accumulations: { type: integer, format: int64, minimum: 0 }
        redemptions: { type: integer, format: int64, minimum: 0 }
    CalendarMetrics:
      type: object
      additionalProperties: false
      required: [period, date, timezone, start_at, end_at, program_type, customers_served, accumulations, redemptions, stamps_issued, stamps_redeemed, points_issued, points_redeemed, series]
      properties:
        period: { type: string, enum: [day, week, month] }
        date: { type: string, format: date }
        timezone: { type: string, description: Zona IANA de la marca }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time, description: Límite exclusivo }
        program_type: { type: string, enum: [SELLOS, PUNTOS, ''] }
        customers_served: { type: integer, format: int64, minimum: 0, description: Clientes distintos con cualquier movimiento confirmado en el intervalo }
        accumulations: { type: integer, format: int64, minimum: 0 }
        redemptions: { type: integer, format: int64, minimum: 0 }
        stamps_issued: { type: integer, format: int64, minimum: 0 }
        stamps_redeemed: { type: integer, format: int64, minimum: 0 }
        points_issued: { type: integer, format: int64, minimum: 0 }
        points_redeemed: { type: integer, format: int64, minimum: 0 }
        series:
          type: array
          items: { $ref: '#/components/schemas/CalendarMetricsBucket' }
    CalendarMetricsEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/CalendarMetrics' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    MovementOperation:
      type: string
      enum: [ACUMULACION, CANJE]
    MovementPreviewRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [operation, qr_token, branch_id]
          properties:
            operation: { type: string, const: ACUMULACION }
            qr_token: { type: string, minLength: 32, maxLength: 256 }
            branch_id: { type: integer, format: int64, minimum: 1 }
            cantidad_puntos:
              type: integer
              minimum: 1
              maximum: 100000
              description: Obligatoria para PUNTOS; debe omitirse para SELLOS, donde el servidor fija 1
        - type: object
          additionalProperties: false
          required: [operation, customer_code, branch_id]
          properties:
            operation: { type: string, const: ACUMULACION }
            customer_code: { $ref: '#/components/schemas/CustomerCode' }
            branch_id: { type: integer, format: int64, minimum: 1 }
            cantidad_puntos:
              type: integer
              minimum: 1
              maximum: 100000
              description: Obligatoria para PUNTOS; debe omitirse para SELLOS, donde el servidor fija 1
        - type: object
          additionalProperties: false
          required: [operation, qr_token, branch_id, benefit_id]
          properties:
            operation: { type: string, const: CANJE }
            qr_token: { type: string, minLength: 32, maxLength: 256 }
            branch_id: { type: integer, format: int64, minimum: 1 }
            benefit_id: { type: integer, format: int64, minimum: 1 }
        - type: object
          additionalProperties: false
          required: [operation, customer_code, branch_id, benefit_id]
          properties:
            operation: { type: string, const: CANJE }
            customer_code: { $ref: '#/components/schemas/CustomerCode' }
            branch_id: { type: integer, format: int64, minimum: 1 }
            benefit_id: { type: integer, format: int64, minimum: 1 }
    UserCode:
      type: string
      readOnly: true
      description: Código público efectivo e inmutable. Iniciales y contador para altas nuevas; #USER-0001 para cuentas anteriores. Nunca reemplaza la PK numérica ni autoriza operaciones.
      examples: [GG-1, GT-1, '#USER-0001']
    CustomerCode:
      type: string
      description: Código público de cliente activo. Acepta iniciales-contador y USER-0001, minúsculas y # opcional. La API valida tipo CLIENTE_FINAL y permisos comerciales.
      maxLength: 25
      examples: [GG-1, '#gg-1', '#USER-0001']
    Preview:
      type: object
      additionalProperties: false
      required: [id, expires_at, operation, program_type, customer, card_id, balance_before, amount, balance_after]
      properties:
        id: { type: string, format: uuid }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        operation: { $ref: '#/components/schemas/MovementOperation' }
        program_type: { type: string, enum: [SELLOS, PUNTOS] }
        customer:
          type: object
          additionalProperties: false
          required: [id, name, user_code]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            user_code: { $ref: '#/components/schemas/UserCode' }
        card_id: { type: integer, format: int64 }
        balance_before: { type: integer, format: int64, minimum: 0 }
        amount: { type: integer, format: int64, minimum: 1 }
        balance_after: { type: integer, format: int64, minimum: 0 }
        benefit: { oneOf: [{ $ref: '#/components/schemas/Benefit' }, { type: 'null' }] }
    PreviewEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/Preview' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    ConfirmAccumulationRequest:
      oneOf:
        - type: object
          additionalProperties: false
