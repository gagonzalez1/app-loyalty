  /suscripciones/{provider_subscription_id}/resultado:
    get:
      tags: [Facturación]
      operationId: getSubscriptionResult
      summary: Consulta el resultado del checkout desde el registro del servidor
      description: Requiere sesión y membresía propietaria activa. Una referencia ajena devuelve 404. No confía en parámetros de estado del retorno de Mercado Pago. Respuesta no almacenable en caché.
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: provider_subscription_id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' } }
      responses:
        '200':
          description: Estado confirmado del registro de la suscripción
          content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionEnvelope' } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marcas/{brand_id}/suscripcion/confirmacion-email:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    post:
      tags: [Facturación]
      operationId: requestSubscriptionConfirmationEmail
      summary: Registra la confirmación por correo de una suscripción autorizada
      description: Sólo el propietario activo con email verificado. No acepta un destinatario arbitrario. La cola cifrada conserva las condiciones al confirmar la autorización; los webhooks y solicitudes repetidos generan como máximo un registro por referencia de suscripción. 202 indica solicitud registrada, no entrega SMTP. Confirma autorización, no el pago de una cuota.
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '202':
          description: Solicitud registrada o ya registrada
          content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { queued: { type: boolean } } }, request_id: { type: string } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: La suscripción todavía no está autorizada }
        '503': { description: 'EMAIL_UNAVAILABLE, proveedor de correo no disponible' }
  /marcas/{brand_id}/suscripcion/checkout:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    post:
      tags: [Facturación]
      summary: Crea el checkout alojado para una suscripción mensual
      description: El primer checkout de la marca incluye un mes gratuito. Los checkout posteriores no repiten la prueba. Si la llamada al proveedor queda incierta, responde BILLING_IN_PROGRESS y no vuelve a crear otra suscripción; el webhook puede conciliarla.
      operationId: createBrandSubscriptionCheckout
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Suscripción pendiente con URL de Mercado Pago
          content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionEnvelope' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /marcas/{brand_id}/suscripcion/cancelacion:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    post:
      tags: [Facturación]
      summary: Cancela la renovación automática en Mercado Pago
      description: La cancelación detiene futuros cobros. No equivale a dar de baja la cuenta de Puntazo.
      operationId: cancelBrandSubscription
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Suscripción cancelada o ya cancelada
          content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionEnvelope' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /mercado-pago/webhooks:
    post:
      tags: [Facturación]
      summary: Recibe y verifica cambios de una suscripción
      operationId: receiveMercadoPagoWebhook
      security: []
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: x-signature, in: header, required: true, schema: { type: string } }
        - { name: x-request-id, in: header, required: true, schema: { type: string } }
        - { name: data.id, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MercadoPagoWebhook' }
      responses:
        '204': { description: Notificación válida procesada o ignorada por no corresponder a suscripciones }
        '401': { description: Firma inválida }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /referidos/validacion:
    post:
      tags: [Referidos]
      operationId: validateReferralCode
      summary: Valida la disponibilidad de un código antes del alta
      description: >-
        Consulta pública de solo lectura, limitada a 60 intentos por IP por minuto.
        Normaliza code con trim y mayúsculas. Comprueba código y campaña activos,
        inicio inclusivo, fin exclusivo y compatibilidad con program_type cuando
        se envía. No reserva ni atribuye el referido; el alta vuelve a comprobarlo
        dentro de su transacción. No expone identidad, contacto ni condiciones.
        Una campaña de ambos programas admite SELLOS y PUNTOS; la respuesta
        devuelve el programa solicitado. Sin program_type devuelve el principal
        de la campaña para conservar compatibilidad.
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralValidationInput' }
      responses:
        '200':
          description: Código disponible ahora; no garantiza su disponibilidad al completar el alta
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralValidationEnvelope' }
        '422':
          description: REFERRAL_CODE_INVALID para formato o disponibilidad; INVALID_REQUEST para JSON o programa inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /marcas/{brand_id}/referidos/codigos:
    get:
      tags: [Referidos]
      operationId: listMerchantReferralCodes
      summary: Devuelve los códigos activos de la marca al propietario o administrador
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: brand_id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: 'Códigos de comerciante vigentes, en data' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /backoffice/login:
