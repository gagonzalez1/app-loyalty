    get:
      tags: [Marcas]
      operationId: listBrandImages
      summary: Lista las imágenes privadas activas de la marca con URLs firmadas
      description: Toda membresía activa puede consultar las imágenes. Sólo propietarios y administradores pueden modificarlas. Las URLs vencen y deben refrescarse volviendo a listar.
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BrandId' }]
      responses:
        '200': { description: Imágenes activas, content: { application/json: { schema: { $ref: '#/components/schemas/BrandImageListEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      tags: [Marcas]
      operationId: uploadBrandImage
      summary: Normaliza y sube una imagen privada de marca o beneficio
      description: |
        JPEG, PNG y WebP hasta 5 MiB, validados por contenido real y reencodeados por el servidor a JPEG o PNG.
        Los logos se reducen proporcionalmente a un máximo de 1024 px por lado y los iconos a 512 px; las imágenes de beneficio conservan hasta 4096 px por lado y 16 megapíxeles.
        Reemplaza atómicamente la imagen activa del mismo slot después del upload. Si el objeto queda activo pero falla únicamente la firma de la URL, responde 201 con el recurso persistido y sin `url` ni `url_expires_at`; el cliente puede recuperarlas volviendo a listar.
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BrandId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [tipo, archivo]
              properties:
                tipo: { type: string, enum: [LOGO, ICONO, BENEFICIO] }
                benefit_id: { type: integer, format: int64, minimum: 1, description: Obligatorio sólo para BENEFICIO }
                archivo: { type: string, format: binary }
      responses:
        '201': { description: Imagen activa; la URL puede omitirse si el presign transitorio falla después de persistirla, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BrandImageEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Archivo mayor a 5 MiB, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '415': { description: Tipo de imagen no soportado, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
