openapi: 3.1.0
info:
  title: Puntazo API · programa gratuito
  version: 0.3.0-contract
  description: |
    Contrato de lanzamiento gratuito para programas Sellos y Puntos.
    Cada operación marcada IMPLEMENTED cuenta con código, persistencia, autorización
    y pruebas de contrato/integración dentro del repositorio aislado de preview.
  x-puntazo-slice: FREE-LAUNCH-SELLOS-PUNTOS
  x-puntazo-authority: ACORDADO_PARA_DEMO
  x-puntazo-approved-decisions: [PC-04, PC-09, PC-10, PC-11, PC-13, PC-14]
  x-puntazo-partial-decisions: [PC-12]
  x-puntazo-deferred: [PC-01, PC-03, PC-05, PC-06, PC-07, PC-08]
servers:
  - url: https://puntazo-preview.blakyta3d.duckdns.org/api/v1
    description: Staging VPS; el gateway web es el único servicio público
  - url: http://localhost:8080/v1
    description: Desarrollo local de API
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Estado operativo y versión desplegada
  - name: Auth
    description: Identidad, sesiones y recuperación
  - name: Demo
    description: Alta gratuita controlada de comercios
  - name: Cuenta
    description: Perfil y ciclo de vida de la cuenta autenticada
  - name: Marcas
    description: Configuración comercial y personal
  - name: Clientes
    description: Clientes finales, tarjetas y saldos
  - name: Analíticas
    description: Resúmenes operativos autorizados
  - name: Movimientos
    description: Preview y confirmación transaccional del ledger
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Comprueba que el proceso está vivo
      operationId: getLiveness
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: El proceso está vivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /health/ready:
    get:
      tags: [Health]
      summary: Comprueba PostgreSQL, esquema, Redis y storage privado
      description: Valida conexión PostgreSQL, versión exacta de migración, disponibilidad del rate limiter Redis y acceso al bucket S3-compatible cuando media está habilitado.
      operationId: getReadiness
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: API, PostgreSQL, migración requerida, Redis y storage configurado están listos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /version:
    get:
      tags: [Health]
      summary: Informa versión de aplicación, commit y esquema
      operationId: getVersion
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Versión desplegada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Registra exclusivamente una cuenta cliente final gratuita
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCustomerRequest' }
      responses:
        '201':
          description: Cliente creado sin suscripción; QR emitido y almacenado sólo como hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterCustomerEnvelope' }
        '403': { $ref: '#/components/responses/DemoSignupClosed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /marcas/{brand_id}/beneficios/{resource_id}:
    parameters: [{ $ref: '#/components/parameters/BrandId' }, { $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Marcas]
      summary: Consulta un beneficio activo o archivado
      operationId: getBenefit
      x-puntazo-implementation: IMPLEMENTED
      responses: { '200': { description: Beneficio activo o inactivo, content: { application/json: { schema: { $ref: '#/components/schemas/BenefitEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Marcas]
      summary: Reemplaza o reactiva un beneficio
      operationId: replaceBenefit
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceBenefitRequest' } } } }
      responses: { '200': { description: Beneficio reemplazado o reactivado, content: { application/json: { schema: { $ref: '#/components/schemas/BenefitEnvelope' } } } }, '412': { description: Versión desactualizada } }
    patch:
      tags: [Marcas]
      summary: Actualiza parcialmente un beneficio
      operationId: patchBenefit
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBenefitRequest' } } } }
      responses: { '200': { description: Beneficio actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/BenefitEnvelope' } } } }, '412': { description: Versión desactualizada } }
    delete:
      tags: [Marcas]
      summary: Archiva lógicamente un beneficio
      operationId: deleteBenefit
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses: { '204': { description: Beneficio desactivado }, '412': { description: Versión desactualizada } }
  /auth/email-verification/request:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      summary: Solicita un correo sin revelar si la cuenta existe
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses:
        '202':
          description: Solicitud aceptada de forma genérica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/email-verification/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmailVerification
      summary: Consume una vez el token de verificación
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } } } }
      responses:
        '200':
          description: Correo verificado; el usuario debe iniciar sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Solicita recuperación sin revelar si la cuenta existe
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses:
        '202':
          description: Solicitud aceptada de forma genérica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Cambia la contraseña y revoca todas las sesiones
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' } } } }
      responses:
        '200':
          description: Contraseña actualizada; requiere iniciar sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /demo/comercios:
    post:
      tags: [Demo]
      operationId: registerDemoMerchant
      summary: Alta atómica e idempotente de un propietario con programa Sellos o Puntos
      security: []
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDemoMerchantRequest' }
      responses:
        '201':
          description: Usuario, marca, propietario, sucursal y programa creados; onboarding continúa sin beneficio
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoMerchantEnvelope' }
        '403': { $ref: '#/components/responses/DemoSignupClosed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia una sesión con email y contraseña verificados
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/google:
    post:
      tags: [Auth]
      operationId: loginGoogle
      summary: Inicia sesión con un ID token de Google verificado
      security: []
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rota el refresh token y emite una sesión nueva
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTransportRequest' }
      responses:
        '200':
          description: Sesión rotada; el refresh token anterior queda invalidado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoca la sesión autenticada
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      responses:
        '204': { description: Sesión revocada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me:
    get:
      tags: [Cuenta]
      summary: Consulta la cuenta y sus membresías activas
      operationId: getCurrentUser
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Identidad y membresías restaurables en otro dispositivo
          headers:
            ETag:
              description: Versión fuerte para mutaciones con If-Match
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Cuenta]
      summary: Actualiza parcialmente el perfil con control de versión
      operationId: updateCurrentUser
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: Perfil actualizado
          headers:
            ETag:
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '412':
          description: If-Match ausente, inválido o desactualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Cuenta]
      operationId: anonymizeCurrentUser
      summary: Anonimiza la cuenta y preserva el ledger histórico
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnonymizeAccountRequest' }
      responses:
        '202':
          description: Anonimización completada y accesos revocados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymizationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: La cuenta sigue siendo el último propietario activo de una marca
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '412':
          description: If-Match ausente, inválido o desactualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/export:
    get:
      tags: [Cuenta]
      operationId: exportCurrentUserData
      summary: Exporta perfil, membresías, tarjetas propias y movimientos del actor
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Exportación JSON consistente de los datos autorizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExportEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /marcas:
    get:
      tags: [Marcas]
      operationId: listMyBrands
      summary: Lista sólo marcas alcanzadas por la membresía del actor
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Marcas visibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantContextListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /marcas/{brand_id}:
    get:
      tags: [Marcas]
      operationId: getMyBrand
      summary: Contexto Sellos de una marca propia
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Marca, sucursal, programa, beneficio y acceso demo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantContextEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Marcas]
      summary: Actualiza parcialmente una marca
      operationId: updateBrand
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BrandId' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBrandRequest' } } } }
      responses: { '200': { description: Marca actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantContextEnvelope' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '412': { description: Versión desactualizada } }
    delete:
      tags: [Marcas]
      summary: Desactiva lógicamente una marca y sus recursos activos
      operationId: deleteBrand
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BrandId' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '204': { description: Marca desactivada }, '403': { $ref: '#/components/responses/Forbidden' }, '412': { description: Versión desactualizada } }
  /marcas/{brand_id}/sucursales:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    get:
      tags: [Marcas]
      summary: Lista sucursales según el alcance del rol
      operationId: listBranches
      x-puntazo-implementation: IMPLEMENTED
      responses: { '200': { description: Sucursales, content: { application/json: { schema: { $ref: '#/components/schemas/BranchListEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Marcas]
      summary: Crea una sucursal activa no principal
      operationId: createBranch
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateBranchRequest' } } } }
      responses: { '201': { description: Sucursal creada, content: { application/json: { schema: { $ref: '#/components/schemas/BranchEnvelope' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /marcas/{brand_id}/sucursales/{resource_id}:
    parameters: [{ $ref: '#/components/parameters/BrandId' }, { $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Marcas]
      summary: Consulta una sucursal visible para el rol
      operationId: getBranch
      x-puntazo-implementation: IMPLEMENTED
      responses: { '200': { description: Sucursal, content: { application/json: { schema: { $ref: '#/components/schemas/BranchEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Marcas]
      summary: Edita o promueve atómicamente una sucursal
      operationId: updateBranch
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBranchRequest' } } } }
      responses: { '200': { description: Sucursal actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/BranchEnvelope' } } } }, '409': { description: Debe conservarse una principal activa }, '412': { description: Versión desactualizada } }
    delete:
      tags: [Marcas]
      summary: Desactiva una sucursal secundaria
      operationId: deleteBranch
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses: { '204': { description: Sucursal desactivada }, '409': { description: No se elimina la principal o última activa }, '412': { description: Versión desactualizada } }
  /marcas/{brand_id}/programa:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    get:
      tags: [Marcas]
      summary: Consulta el programa de fidelidad de la marca
      operationId: getProgram
      x-puntazo-implementation: IMPLEMENTED
      responses: { '200': { description: Programa, content: { application/json: { schema: { $ref: '#/components/schemas/ProgramEnvelope' } } } } }
    put:
      tags: [Marcas]
      summary: Reemplaza la configuración versionada del programa
      operationId: updateProgram
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProgramRequest' } } } }
      responses: { '200': { description: Programa actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/ProgramEnvelope' } } } }, '409': { description: PROGRAM_TYPE_HAS_BENEFITS si existen beneficios o PROGRAM_TYPE_IMMUTABLE tras el primer movimiento }, '412': { description: Versión desactualizada } }
  /marcas/{brand_id}/beneficios:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Marcas]
      operationId: listBenefits
      summary: Lista beneficios activos e inactivos del programa de la marca
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Lista vacía durante el onboarding inicial; incluye inactivos para permitir reactivación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitListEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Marcas]
      operationId: createBenefit
      summary: Crea un beneficio compatible con Sellos o Puntos
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBenefitRequest' }
      responses:
        '201':
          description: Beneficio creado; completa el onboarding si es el primero activo
          headers:
            ETag:
              schema: { type: string, example: '"1"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenefitEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{brand_id}/movimientos:
    get:
      tags: [Movimientos]
      operationId: listBrandMovements
      summary: Historial de la marca limitado a membresía y sucursales autorizadas
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Movimientos visibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementPageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marcas/{brand_id}/invitaciones:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    get:
      tags: [Marcas]
      summary: Lista invitaciones de personal de la marca
      operationId: listBrandInvitations
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200': { description: Invitaciones, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationListEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Marcas]
      summary: Invita un administrador u operador durante 72 horas
      operationId: createBrandInvitation
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvitationRequest' } } } }
      responses:
        '201': { description: Invitación creada, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: El usuario ya pertenece a la marca }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{brand_id}/invitaciones/{invitation_id}:
    parameters: [{ $ref: '#/components/parameters/BrandId' }, { name: invitation_id, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [Marcas]
      summary: Revoca una invitación pendiente
      operationId: revokeBrandInvitation
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '204': { description: Revocada }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: INVITATION_INVALID }
  /marcas/{brand_id}/invitaciones/{invitation_id}/reenviar:
    parameters: [{ $ref: '#/components/parameters/BrandId' }, { name: invitation_id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Marcas]
      summary: Rota el token y renueva una invitación pendiente por 72 horas
      operationId: resendBrandInvitation
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200': { description: Invitación renovada, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: INVITATION_INVALID }
  /invitaciones/{token}:
    get:
      security: []
      tags: [Auth]
      summary: Consulta una invitación válida con el email enmascarado
      operationId: getPublicInvitation
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 40, maxLength: 256 } }]
      responses:
        '200': { description: Invitación válida, content: { application/json: { schema: { $ref: '#/components/schemas/PublicInvitationEnvelope' } } } }
        '422': { description: IDENTITY_TOKEN_INVALID }
  /invitaciones/{token}/aceptar:
    post:
      tags: [Auth]
      summary: Acepta una invitación para el email exacto de la sesión
      operationId: acceptBrandInvitation
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 40, maxLength: 256 } }]
      responses:
        '200': { description: Membresía creada, content: { application/json: { schema: { $ref: '#/components/schemas/StaffEnvelope' } } } }
        '409': { description: 'INVITATION_EMAIL_MISMATCH, ACCOUNT_MODE_CONFLICT o membresía activa existente' }
        '422': { description: IDENTITY_TOKEN_INVALID }
  /marcas/{brand_id}/personal:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    get:
      tags: [Marcas]
      summary: Lista propietarios, administradores y operadores
      operationId: listBrandStaff
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200': { description: Personal, content: { application/json: { schema: { $ref: '#/components/schemas/StaffListEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /marcas/{brand_id}/personal/{id_membresia}:
    parameters: [{ $ref: '#/components/parameters/BrandId' }, { name: id_membresia, in: path, required: true, description: 'Identificador de membresía, no de usuario', schema: { type: integer, format: int64, minimum: 1 } }]
    get:
      tags: [Marcas]
      summary: Consulta un miembro de personal
      operationId: getBrandStaff
      x-puntazo-implementation: IMPLEMENTED
      responses: { '200': { description: Personal, content: { application/json: { schema: { $ref: '#/components/schemas/StaffEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [Marcas]
      summary: Cambia rol o asignaciones de un administrador u operador
      operationId: updateBrandStaff
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateStaffRequest' } } } }
      responses: { '200': { description: Personal actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/StaffEnvelope' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '412': { description: Versión desactualizada } }
    delete:
      tags: [Marcas]
      summary: Revoca el acceso de un administrador u operador
      operationId: deleteBrandStaff
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses: { '204': { description: Acceso revocado }, '403': { $ref: '#/components/responses/Forbidden' }, '412': { description: Versión desactualizada } }
  /marcas/{brand_id}/clientes:
    get:
      tags: [Clientes]
      operationId: listBrandCustomers
      summary: Lista clientes con tarjeta y saldo real de la marca
      description: Sólo lectura para propietarios activos; nunca devuelve el QR del cliente.
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Clientes visibles, ordenados por actividad más reciente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandCustomerPageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /marcas/{brand_id}/metricas/resumen:
    get:
      tags: [Analíticas]
      operationId: getBrandOperationalSummary
      summary: Totales operativos históricos de la marca
      description: |
        Resumen de sólo lectura calculado desde tarjetas y movimientos confirmados.
        No implementa todavía períodos, comparaciones, predicciones ni drill-down de PC-08.
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Totales históricos visibles para el propietario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalSummaryEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /marcas/{brand_id}/imagenes:
    get:
      tags: [Marcas]
      operationId: listBrandImages
      summary: Lista las imágenes privadas activas de la marca con URLs firmadas
      description: Sólo propietarios y administradores. Las URLs vencen y deben refrescarse volviendo a listar.
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BrandId' }]
      responses:
        '200': { description: Imágenes activas, content: { application/json: { schema: { $ref: '#/components/schemas/BrandImageListEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      tags: [Marcas]
      operationId: uploadBrandImage
      summary: Normaliza y sube una imagen privada de marca o beneficio
      description: |
        JPEG, PNG y WebP hasta 5 MiB, validados por contenido real y reencodeados por el servidor a JPEG o PNG.
        Los logos se reducen proporcionalmente a un máximo de 1024 px por lado y los iconos a 512 px; las imágenes de beneficio conservan hasta 4096 px por lado y 16 megapíxeles.
        Reemplaza atómicamente la imagen activa del mismo slot después del upload. Si el objeto queda activo pero falla únicamente la firma de la URL, responde 201 con el recurso persistido y sin `url` ni `url_expires_at`; el cliente puede recuperarlas volviendo a listar.
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BrandId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [tipo, archivo]
              properties:
                tipo: { type: string, enum: [LOGO, ICONO, BENEFICIO] }
                benefit_id: { type: integer, format: int64, minimum: 1, description: Obligatorio sólo para BENEFICIO }
                archivo: { type: string, format: binary }
      responses:
        '201': { description: Imagen activa; la URL puede omitirse si el presign transitorio falla después de persistirla, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BrandImageEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Archivo mayor a 5 MiB, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '415': { description: Tipo de imagen no soportado, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /marcas/{brand_id}/imagenes/{image_id}:
    delete:
      tags: [Marcas]
      operationId: deleteBrandImage
      summary: Programa la eliminación irreversible de una imagen dentro de 24 horas
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
        - $ref: '#/components/parameters/ImageId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Imagen retirada del listado y programada para borrado físico }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { description: Versión desactualizada, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /clientes/me:
    get:
      tags: [Clientes]
      operationId: getCurrentCustomer
      summary: Devuelve el QR opaco sólo a su dueño
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Perfil del cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clientes/me/tarjetas:
    get:
      tags: [Clientes]
      summary: Lista las tarjetas activas del cliente autenticado
      operationId: listCurrentCustomerCards
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Tarjetas y saldos persistidos del cliente autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardPageEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /clientes/me/tarjetas/{card_id}/movimientos:
    get:
      tags: [Clientes]
      summary: Lista movimientos autorizados de una tarjeta propia
      operationId: listCurrentCustomerCardMovements
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/CardId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Historial de una tarjeta propia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementPageEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /movimientos/preview:
    post:
      tags: [Movimientos]
      operationId: previewMovement
      summary: Calcula Sellos por QR o ID de cliente sin cambiar tarjeta ni historial; vence a los cinco minutos
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MovementPreviewRequest' }
      responses:
        '200':
          description: Preview temporal, sin reserva de saldo y utilizable una vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /movimientos/scan:
    post:
      tags: [Movimientos]
      operationId: confirmAccumulation
      summary: Confirma una acumulación Sellos transaccional
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmAccumulationRequest' }
      responses:
        '201':
          description: Un sello acreditado y movimiento persistido en la misma transacción
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /movimientos/canje:
    post:
      tags: [Movimientos]
      operationId: confirmRedemption
      summary: Confirma un canje Sellos transaccional
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmRedemptionRequest' }
      responses:
        '201':
          description: Sellos debitados y movimiento persistido en la misma transacción
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /movimientos/idempotencia/{idempotency_key}:
    get:
      tags: [Movimientos]
      operationId: getMovementByIdempotencyKey
      summary: Resuelve un resultado incierto sin reenviar la mutación
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyPath'
      responses:
        '200':
          description: Resultado previamente confirmado por el mismo actor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    IdempotentReplayed:
      description: "true cuando la respuesta se reprodujo desde el registro idempotente"
      schema: { type: boolean }
  parameters:
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: true
      description: web usa cookie HttpOnly; native transporta refresh_token en JSON y debe guardarlo en SecureStore
      schema: { type: string, enum: [web, native] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyPath:
      name: idempotency_key
      in: path
      required: true
      schema: { type: string, format: uuid }
    BrandId:
      name: brand_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ImageId:
      name: image_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    CardId:
      name: card_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      description: Búsqueda parcial por nombre o email del cliente
      schema: { type: string, maxLength: 120 }
  responses:
    Unauthenticated:
      description: Sesión ausente o inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: El actor no posee el tipo de cuenta, marca o sucursal requerida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Recurso inexistente o fuera del ownership visible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflicto de email, idempotencia, preview o saldo
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationError:
      description: Request válido como JSON pero inválido para el contrato
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: Límite por IP, email u operador excedido
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DependencyUnavailable:
      description: PostgreSQL o esquema requerido no disponible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DemoSignupClosed:
      description: Altas cerradas o código de demo inválido
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    Timestamp:
      type: string
      format: date-time
    RequestId:
      type: string
      format: uuid
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version, commit, schema_version]
      properties:
        version: { type: string }
        commit: { type: string, pattern: '^[0-9a-f]{7,40}$' }
        schema_version: { type: string, pattern: '^[0-9]{4}$' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, IDENTITY_TOKEN_INVALID, INVITATION_INVALID, INVITATION_EMAIL_MISMATCH, SELF_ROLE_CHANGE_FORBIDDEN, EMAIL_VERIFICATION_REQUIRED, UNAUTHENTICATED, RECENT_AUTH_REQUIRED, FORBIDDEN, NOT_FOUND, EMAIL_EXISTS, RESOURCE_CONFLICT, PROGRAM_TYPE_HAS_BENEFITS, PROGRAM_TYPE_IMMUTABLE, IDEMPOTENCY_CONFLICT, IDEMPOTENCY_IN_PROGRESS, PREVIEW_EXPIRED, PREVIEW_CONSUMED, PREVIEW_CHANGED, PRECONDITION_FAILED, OWNERSHIP_TRANSFER_REQUIRED, INSUFFICIENT_BALANCE, DEMO_SIGNUP_DISABLED, DEMO_ACCESS_DENIED, MEDIA_TOO_LARGE, MEDIA_TYPE_UNSUPPORTED, MEDIA_STORAGE_UNAVAILABLE, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string }
            details: { type: object, additionalProperties: true }
        request_id: { $ref: '#/components/schemas/RequestId' }
    MessageEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message: { type: string }
        request_id: { $ref: '#/components/schemas/RequestId' }
    AccountType:
      type: string
      enum: [CLIENTE_FINAL, PERSONAL_MARCA]
    User:
      type: object
      additionalProperties: false
      required: [id, email, name, account_type, active, email_verified, auth_version, version, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        apellido: { type: string, maxLength: 120 }
        alias: { type: string, maxLength: 80 }
        foto_url: { type: string, format: uri, maxLength: 2048 }
        account_type: { $ref: '#/components/schemas/AccountType' }
        active: { type: boolean }
        email_verified: { type: boolean }
        auth_version: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        apellido: { type: [string, 'null'], maxLength: 120 }
        alias: { type: [string, 'null'], maxLength: 80 }
        foto_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
    AnonymizeAccountRequest:
      type: object
      additionalProperties: false
      required: [confirmacion]
      properties:
        confirmacion: { type: string, const: ANONIMIZAR }
    Anonymization:
      type: object
      additionalProperties: false
      required: [id_solicitud, estado, acceso_revocado, ledger_preservado, requested_at]
      properties:
        id_solicitud: { type: string, format: uuid }
        estado: { type: string, const: COMPLETADA }
        acceso_revocado: { type: boolean, const: true }
        ledger_preservado: { type: boolean, const: true }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
    AnonymizationEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/Anonymization' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    Membership:
      type: object
      additionalProperties: false
      required: [brand_id, brand_name, role, branch_ids, active]
      properties:
        brand_id: { type: integer, format: int64 }
        brand_name: { type: string }
        role: { type: string, enum: [PROPIETARIO, ADMINISTRADOR, OPERADOR] }
        branch_ids:
          type: array
          items: { type: integer, format: int64 }
        active: { type: boolean }
    Session:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token:
          type: string
          description: Presente sólo para native; web recibe la cookie puntazo_refresh HttpOnly, Secure y SameSite=Strict
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          const: 900
          description: Vida del access token en segundos; el refresh token rota en cada uso
    AuthData:
      type: object
      additionalProperties: false
      required: [session, user]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        user: { $ref: '#/components/schemas/User' }
    AuthEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/AuthData' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    RegisterCustomerData:
      type: object
      additionalProperties: false
      required: [user, verification_required]
      properties:
        user: { $ref: '#/components/schemas/User' }
        session: { $ref: '#/components/schemas/Session' }
        verification_required: { type: boolean }
    RegisterCustomerEnvelope:
      type: object
      additionalProperties: false
      required: [data, request_id]
      properties:
        data: { $ref: '#/components/schemas/RegisterCustomerData' }
        request_id: { $ref: '#/components/schemas/RequestId' }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties: { email: { type: string, format: email, maxLength: 254 } }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties: { token: { type: string, minLength: 40, maxLength: 256 } }
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 40, maxLength: 256 }
        new_password: { type: string, format: password, minLength: 10, maxLength: 72 }
    RegisterCustomerRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          description: Máximo 72 bytes en UTF-8 por compatibilidad con bcrypt
        name: { type: string, minLength: 1, maxLength: 120 }
    RegisterDemoMerchantRequest:
      type: object
      additionalProperties: false
      required: [email, password, owner_name, brand_name, branch_name, program_type, access_code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
          description: Máximo 72 bytes en UTF-8 por compatibilidad con bcrypt
        owner_name: { type: string, minLength: 1, maxLength: 120 }
