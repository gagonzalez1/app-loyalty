      responses:
        '204': { description: Sesión interna revocada }
  /backoffice/campaigns:
    get:
      tags: [Backoffice]
      operationId: listReferralCampaigns
      summary: Lista las campañas de referidos
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Hasta 200 campañas ordenadas por ID descendente, con cobertura y versión
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { $ref: '#/components/schemas/RequestId' }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ReferralCampaign' }
    post:
      tags: [Backoffice]
      operationId: createReferralCampaign
      summary: Requiere ADMIN_SISTEMA; rechaza ventanas superpuestas del mismo programa
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BackofficeRequest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReferralCampaignInput' }
      responses:
        '201': { description: Campaña creada y códigos de comercios existentes generados, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralCampaignEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: CAMPAIGN_OVERLAP; ventana activa superpuesta para alguno de los programas }
        '422': { description: 'Programa, cobertura, fechas o condiciones inválidos' }
  /backoffice/campaigns/{id}:
    put:
      tags: [Backoffice]
      operationId: updateReferralCampaign
      summary: Edita una campaña para futuras altas; requiere ADMIN_SISTEMA
      description: 'Actualiza nombre, cobertura, condiciones y fechas conservando estado y atribuciones anteriores. Requiere la version leída. Audita antes/después y genera códigos faltantes para los programas incluidos. Una campaña activa no puede superponer ventanas de alguno de sus programas.'
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: '#/components/parameters/BackofficeRequest' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReferralCampaignUpdateInput' } } }
      responses:
        '200': { description: Campaña actualizada y auditada, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralCampaignEnvelope' } } } }
        '401': { description: Sesión interna requerida }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Campaña inexistente }
        '409': { description: CAMPAIGN_CHANGED o CAMPAIGN_OVERLAP; no se guardan cambios parciales }
        '422': { description: Datos inválidos o versión faltante }
  /backoffice/campaigns/{id}/active:
    patch:
      tags: [Backoffice]
      operationId: setReferralCampaignActive
      summary: Requiere ADMIN_SISTEMA; no altera atribuciones previas
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: '#/components/parameters/BackofficeRequest' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean } } } } }
      responses:
        '204': { description: Estado guardado y auditado; incrementa version }
        '409': { description: CAMPAIGN_OVERLAP al activar }
  /backoffice/influencers:
    get:
      tags: [Backoffice]
      operationId: listReferralInfluencers
      summary: Lista influencers con nombre, contacto anterior y email cuando está registrado
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Hasta 500 influencers; email es null para contactos anteriores que no son emails
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, contact, email]
                      properties:
                        id: { type: integer, format: int64 }
                        name: { type: string }
                        contact: { type: string }
                        email: { type: [string, 'null'], format: email }
    post:
      tags: [Backoffice]
      operationId: createReferralInfluencer
      summary: Requiere ADMIN_SISTEMA
      description: 'Alta con name, email, code y campaign_id crea influencer, primer código y correo INFLUENCER_WELCOME en la misma transacción. La cola guarda una copia cifrada de las condiciones de campaña al alta y reintenta hasta cinco veces; el envío es asíncrono por el mismo proveedor de correo que las contraseñas. No envía correos a perfiles existentes ni al agregar otro código. El email se normaliza y se guarda en el contacto existente. Se conserva la compatibilidad con el payload anterior name/contact, que sólo crea el perfil.'
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BackofficeRequest' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [name, email, code, campaign_id]
                  properties:
                    name: { type: string, minLength: 2, maxLength: 120 }
                    email: { type: string, format: email, maxLength: 200 }
                    code: { type: string, pattern: '^[A-Za-z0-9-]{4,40}$', description: Nombre del código compartible; se normaliza a mayúsculas }
                    campaign_id: { type: integer, format: int64, minimum: 1 }
                - type: object
                  required: [name, contact]
                  additionalProperties: false
                  properties:
                    name: { type: string, minLength: 2, maxLength: 120 }
                    contact: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '201': { description: 'Alta auditada; en el flujo nuevo data incluye id, name, email, contact, code como objeto ReferralCode y email_queued=true. Confirma encolado, no entrega' }
        '403': { description: Requiere ADMIN_SISTEMA y encabezado CSRF }
        '409': { description: Código repetido; no se crea el influencer }
        '422': { description: 'Datos incompletos o inválidos, código reservado o campaña inexistente' }
        '503': { description: EMAIL_UNAVAILABLE si falta la clave de cifrado; se revierte toda el alta }
  /backoffice/influencers/{id}/earnings:
    get:
      tags: [Backoffice]
      operationId: getInfluencerEarnings
      summary: Detalle de comisiones por mes y cliente; Admin y Finanzas
      description: >-
        Consulta de solo lectura del ledger completo del influencer, incluyendo
        todos sus códigos y comercios cerrados. Totales y acumulados por cliente
        abarcan todos los meses, independientemente de la página mensual.
        El mes se determina por referral_charges.created_at en
        America/Argentina/Buenos_Aires, fecha de registro del cobro verificado,
        no período de facturación del proveedor. Una devolución actualiza el
        estado del mes original. Generado incluye PENDING, SETTLED, VOID y
        RECOVERY_DUE; el importe a pagar es sólo PENDING. No recalcula condiciones
        con la campaña actual ni compensa automáticamente importes por recuperar.
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: before, in: query, schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }, description: Mes exclusivo YYYY-MM; años 0001 a 9999 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 12 }, description: 'Cantidad de meses con registros, ordenados del más reciente al más antiguo' }
      responses:
        '200':
          description: Snapshot consistente de comisiones en centavos de ARS; arrays vacíos cuando no hay registros
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfluencerEarningsEnvelope' }
        '401': { description: Sesión interna requerida }
        '404': { description: Influencer inexistente }
        '422': { description: 'ID, límite o mes inválidos' }
  /backoffice/codes:
    get:
      tags: [Backoffice]
      operationId: listReferralCodes
      summary: Lista los códigos de referidos
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200': { description: 'Hasta 1000 códigos, en data' }
    post:
      tags: [Backoffice]
      operationId: createInfluencerReferralCode
