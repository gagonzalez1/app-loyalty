        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Invitación reservada, cerrada o cancelada; sucursal inactiva' }
        '422': { description: Solicitud inválida }
        '429': { description: Límite por actor excedido; incluye Retry-After }
        '503': { description: DEPENDENCY_UNAVAILABLE; Google Places opcional o control de tráfico no disponible }
components:
  securitySchemes:
    backofficeCookie:
      type: apiKey
      in: cookie
      name: puntazo_backoffice
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    IdempotentReplayed:
      description: "true cuando la respuesta se reprodujo desde el registro idempotente"
      schema: { type: boolean }
  parameters:
    BackofficeRequest:
      name: X-Backoffice-Request
      in: header
      required: true
      schema: { type: string, const: '1' }
    ClientPlatform:
      name: X-Client-Platform
      in: header
      required: true
      description: web usa cookie HttpOnly; native transporta refresh_token en JSON y debe guardarlo en SecureStore
      schema: { type: string, enum: [web, native] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKeyPath:
      name: idempotency_key
      in: path
      required: true
      schema: { type: string, format: uuid }
    BrandId:
      name: brand_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    ImageId:
      name: image_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    CardId:
      name: card_id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      description: Búsqueda parcial por nombre o email; coincidencia exacta por código público normalizado (GG-1, #gg-1 o #USER-0001) o ID numérico anterior del cliente
      schema: { type: string, maxLength: 120 }
  responses:
    Unauthenticated:
      description: Sesión ausente o inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: El actor no posee el tipo de cuenta, marca o sucursal requerida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Recurso inexistente o fuera del ownership visible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Conflicto de email, idempotencia, preview o saldo
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    ValidationError:
      description: Request válido como JSON pero inválido para el contrato. REGISTRATION_PROFILE_REQUIRED exige nombre y apellido con letras; las aplicaciones antiguas deben actualizarse.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    GoogleAuthValidationError:
      description: |
        Request inválido o identidad Google verificada que requiere completar nombre/apellido o elegir el tipo de
        cuenta antes de realizar cualquier escritura o emitir una sesión.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AccountTypeRequiredErrorEnvelope'
              - $ref: '#/components/schemas/InvalidRequestErrorEnvelope'
              - $ref: '#/components/schemas/RegistrationProfileRequiredErrorEnvelope'
    RateLimited:
      description: Límite por IP, email u operador excedido
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DependencyUnavailable:
      description: PostgreSQL o esquema requerido no disponible
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    DemoSignupClosed:
      description: Altas cerradas o código de demo inválido
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    SubscriptionPricesEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        data: { type: array, items: { $ref: '#/components/schemas/SubscriptionPrice' } }
    SubscriptionPrice:
      type: object
      required: [program_type, unit_price_minor, version, customized, updated_at]
      properties:
        program_type: { type: string, enum: [SELLOS, PUNTOS] }
        unit_price_minor: { type: integer, format: int64, minimum: 1, description: Centavos de ARS por sucursal y mes }
        version: { type: integer, format: int64, minimum: 0 }
        customized: { type: boolean }
        updated_at: { type: [string, 'null'], format: date-time }
    SubscriptionPricePreview:
      type: object
      properties:
        brand_id: { type: integer, format: int64 }
        brand_name: { type: string }
        subscription_status: { type: string, enum: [PENDING, AUTHORIZED, PAUSED] }
        branches: { type: integer, format: int64 }
        current_amount_minor: { type: integer, format: int64 }
        new_amount_minor: { type: integer, format: int64 }
        discount_bps: { type: integer }
        discount_remaining_charges: { type: integer }
    SubscriptionPriceChangeEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        data:
          type: object
          required: [id, program_type, unit_price_minor, previous_unit_price_minor, admin_email, price_version, include_existing, created_at, items]
          properties:
            id: { type: string, format: uuid }
            program_type: { type: string, enum: [SELLOS, PUNTOS] }
            unit_price_minor: { type: integer, format: int64 }
            previous_version: { type: integer, format: int64 }
            previous_unit_price_minor: { type: [integer, 'null'], format: int64, description: Precio base previo; null si no fue registrado en un cambio antiguo }
            admin_email: { type: string, format: email }
            price_version: { type: integer, format: int64 }
            include_existing: { type: boolean }
            created_at: { type: string, format: date-time }
            items:
              type: array
              items:
                type: object
                properties:
                  brand_id: { type: integer, format: int64 }
                  brand_name: { type: string }
                  status: { type: string, enum: [PENDING, APPLIED, SKIPPED, FAILED] }
                  amount_minor: { type: [integer, 'null'], format: int64 }
    SubscriptionPriceHistoryEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        data:
          type: object
          required: [items, next_cursor]
          properties:
            next_cursor: { type: [string, 'null'], format: uuid }
            items:
              type: array
              maxItems: 50
              items:
                type: object
                required: [id, program_type, unit_price_minor, previous_unit_price_minor, admin_email, include_existing, created_at, total, applied, pending, failed, skipped]
                properties:
                  id: { type: string, format: uuid }
                  program_type: { type: string, enum: [SELLOS, PUNTOS] }
                  unit_price_minor: { type: integer, format: int64, description: Precio base nuevo en centavos de ARS por sucursal }
                  previous_unit_price_minor: { type: [integer, 'null'], format: int64, description: Precio base anterior registrado; los cambios iniciales antiguos pueden carecer de este dato }
                  admin_email: { type: string, format: email }
                  include_existing: { type: boolean }
                  created_at: { type: string, format: date-time }
                  total: { type: integer, minimum: 0 }
                  applied: { type: integer, minimum: 0 }
                  pending: { type: integer, minimum: 0 }
                  failed: { type: integer, minimum: 0 }
                  skipped: { type: integer, minimum: 0 }
    BackofficeCustomersEnvelope:
      type: object
      required: [data, request_id]
      properties:
        request_id: { $ref: '#/components/schemas/RequestId' }
        data:
          type: array
          items: { $ref: '#/components/schemas/BackofficeCustomer' }
    BackofficeCustomer:
      type: object
      required: [brand_id, brand_name, active, created_at, program_type, subscription_status, unit_price_minor, full_unit_price_minor, monthly_amount_minor, subscribed_branches, next_payment_at, paid_charges, paid_amount_minor, refunded_charges, last_payment_at, referral_code, source_kind, source_name, campaign_name, discount_bps, discount_charges, discount_remaining_charges, branches]
      properties:
        brand_id: { type: integer, format: int64 }
        brand_name: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        program_type: { type: [string, 'null'], enum: [SELLOS, PUNTOS, null] }
        subscription_status: { type: [string, 'null'], enum: [CREATING, PENDING, AUTHORIZED, PAUSED, CANCELLED, null] }
        unit_price_minor: { type: [integer, 'null'], format: int64, description: Precio contratado por sucursal con descuento aplicado }
