    post:
      tags: [Reseñas]
      summary: Registra render o respuesta idempotente con token de reserva
      operationId: recordReviewEvent
      x-puntazo-implementation: IMPLEMENTED
      description: PRESENTADA requiere lease vigente y se envía después del render. OMITIDA y CLIC requieren PRESENTADA y el mismo token; el token sigue válido después del vencimiento para esa respuesta. CLIC registra apertura exitosa, nunca una reseña confirmada en Google.
