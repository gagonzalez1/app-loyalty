      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BackofficeRequest' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code, campaign_id, influencer_id], properties: { code: { type: string }, campaign_id: { type: integer }, influencer_id: { type: integer } } } } }
      responses:
        '201': { description: Código creado y auditado }
  /backoffice/codes/{id}/active:
    patch:
      tags: [Backoffice]
      operationId: setReferralCodeActive
      summary: Activa o pausa un código para nuevas altas
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: '#/components/parameters/BackofficeRequest' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean } } } } }
      responses:
        '204': { description: Estado guardado y auditado }
  /backoffice/attributions:
    get:
      tags: [Backoffice]
      operationId: listReferralAttributions
      summary: Lista las marcas atribuidas y sus condiciones
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200': { description: 'Hasta 1000 marcas atribuidas con condiciones congeladas, en data' }
  /backoffice/rewards:
    get:
      tags: [Backoffice]
      operationId: listReferralRewards
      summary: Lista las recompensas de cobros verificados
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200': { description: 'Hasta 1000 recompensas nacidas de cobros verificados, en data' }
  /backoffice/rewards/{invoice}/settle:
    post:
      tags: [Backoffice]
