          type: [string, 'null']
          description: HTTPS sin credenciales ni puerto, host exacto g.page, maps.app.goo.gl, maps.google.com, www.google.com, search.google.com o share.google. Se exige sólo el destino seleccionado cuando enabled=true.
    ReviewSettings:
      type: object
