  /marcas/{brand_id}/metricas/periodo:
    get:
      tags: [Analíticas]
      operationId: getBrandCalendarMetrics
      summary: Actividad confirmada en un período calendario de la marca
      description: |
        Sólo propietario PERSONAL_MARCA activo. Incluye todas las sucursales y preserva movimientos
        de clientes desactivados o anonimizados. Semana de lunes a domingo; mes calendario.
        Intervalo [start_at, end_at) en zona_horaria de la marca, calculado en un mismo snapshot
        con autorización, totales y serie. date omitida usa hoy en esa zona; fecha futura rechazada.
        Serie de 24 horas para day, siete fechas para week y días del mes para month, incluyendo
        ceros. Horas locales repetidas por DST se combinan; horas inexistentes conservan cero.
        Una fecha local completamente omitida por cambio de zona horaria se rechaza.
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [day, week, month] }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Totales y serie del período seleccionado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarMetricsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
