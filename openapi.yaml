      - { name: invitation_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reseñas]
      summary: Reserva atómica de 60 segundos; resuelve enlace antes de la transacción
      operationId: reserveReview
      x-puntazo-implementation: IMPLEMENTED
      responses:
