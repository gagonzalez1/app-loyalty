    post:
      tags: [Backoffice]
      operationId: recordManualMerchantCredit
      summary: Requiere FINANZAS; registra un reembolso externo ya realizado contra una factura pagada
      description: La referencia externa es declarada por Finanzas y no verifica por sí misma una transferencia. No modifica el importe recurrente de Mercado Pago.
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: '#/components/parameters/BackofficeRequest' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantCreditAllocationInput' }
      responses:
        '201':
          description: Asignación registrada con idempotencia y auditoría
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantCreditAllocationEnvelope' }
        '409': { description: 'Saldo insuficiente, factura agotada o referencia duplicada' }
  /backoffice/prices:
    get:
      tags: [Backoffice]
      operationId: getSubscriptionPrices
      summary: Consulta los precios mensuales de Sellos y Puntos por sucursal
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Dos precios; fallback de configuración hasta personalizarlos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPricesEnvelope' }
  /backoffice/prices/{program}/preview:
    get:
      tags: [Backoffice]
      operationId: previewSubscriptionPrice
      summary: Calcula el impacto sobre suscripciones existentes sin modificar datos
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: program, in: path, required: true, schema: { type: string, enum: [SELLOS, PUNTOS] } }
        - { name: unit_price_minor, in: query, required: true, schema: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 } }
      responses:
        '200':
          description: Cohorte actual con importe contratado, nuevo importe y descuentos restantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SubscriptionPricePreview' } }
        '422': { description: Programa o precio inválido }
  /backoffice/prices/{program}:
    put:
      tags: [Backoffice]
      operationId: changeSubscriptionPrice
      summary: ADMIN_SISTEMA modifica un precio y elige incluir suscripciones existentes
      description: 'Cambio de catálogo auditado e idempotente. include_existing encola actualizaciones durables para marcas activas y suscripciones PENDING, AUTHORIZED o PAUSED. Conserva descuentos restantes; canceladas, marcas cerradas y checkouts CREATING quedan fuera. El worker usa Mercado Pago y registra APPLIED sólo tras confirmar el importe. Las facturas emitidas antes del cambio conservan el precio histórico verificable.'
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: program, in: path, required: true, schema: { type: string, enum: [SELLOS, PUNTOS] } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/BackofficeRequest' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unit_price_minor, version, include_existing]
              properties:
                unit_price_minor: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
                version: { type: integer, format: int64, minimum: 0 }
                include_existing: { type: boolean }
      responses:
        '202':
          description: Precio persistido y actualización consultable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPriceChangeEnvelope' }
        '422': { description: 'Programa, precio o payload inválido' }
        '403': { description: Requiere ADMIN_SISTEMA y encabezado CSRF }
        '409': { description: Versión desactualizada o clave reutilizada con otro payload }
        '503': { description: Proveedor de facturación no disponible para incluir existentes }
  /backoffice/price-changes:
    get:
      tags: [Backoffice]
      operationId: listSubscriptionPriceChanges
      summary: Historial global de cambios de precios con administrador y resultados
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: before, in: query, schema: { type: string, format: uuid }, description: ID del último cambio de la página anterior }
      responses:
        '200':
          description: Cambios ordenados por fecha e ID descendentes; disponible para Admin y Finanzas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPriceHistoryEnvelope' }
        '422': { description: Límite inválido o cursor desconocido }
        '401': { description: Sesión interna requerida }
  /backoffice/price-changes/{id}:
    get:
      tags: [Backoffice]
      operationId: getSubscriptionPriceChange
      summary: Consulta el resultado de una actualización de precios
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cambio y resultados por cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionPriceChangeEnvelope' }
        '404': { description: Cambio no encontrado }
  /backoffice/price-changes/{id}/retry:
    post:
      tags: [Backoffice]
      operationId: retrySubscriptionPriceChange
      summary: ADMIN_SISTEMA reintenta únicamente actualizaciones fallidas
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/BackofficeRequest' }
      responses:
        '204': { description: Fallidas encoladas de nuevo con auditoría }
        '403': { description: Requiere ADMIN_SISTEMA y encabezado CSRF }
        '409': { description: No hay fallidas para reintentar }
  /backoffice/customers:
    get:
      tags: [Backoffice]
      operationId: getBackofficeCustomers
      summary: Lista todos los clientes comerciales con pagos, promoción asignada y referido
      description: 'Incluye todos los comercios, aunque no tengan suscripción, programa, pagos o referido, y marcas cerradas. branches incluye sus sucursales activas e inactivas, ordenadas con las activas y principal primero; su cantidad es independiente del contrato. Pagos verificados positivos no devueltos; sin registros no demuestra ausencia de pagos históricos. Los descuentos usan la atribución congelada y los cobros consumidos, incluidas devoluciones. Disponible para ADMIN_SISTEMA y FINANZAS mediante sesión interna.'
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Clientes ordenados por fecha de alta descendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackofficeCustomersEnvelope' }
        '401': { description: Sesión interna requerida o inválida }
  /backoffice/metrics:
    get:
      tags: [Backoffice]
      operationId: getReferralPilotMetrics
      summary: Consulta las métricas del piloto de referidos
      security: [{ backofficeCookie: [] }]
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200': { description: 'Conteos de conversión y continuidad y costos en centavos, en data' }
  /marcas/{brand_id}/sucursales/{resource_id}/resenas:
    parameters:
