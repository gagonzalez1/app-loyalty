openapi: 3.1.0
info:
  title: Puntazo API · programa gratuito
  version: 0.3.0-contract
  description: |
    Contrato de lanzamiento gratuito para programas Sellos y Puntos.
    Cada operación marcada IMPLEMENTED cuenta con código, persistencia, autorización
    y pruebas de contrato/integración dentro del repositorio aislado de preview.
  x-puntazo-slice: FREE-LAUNCH-SELLOS-PUNTOS
  x-puntazo-authority: ACORDADO_PARA_DEMO
  x-puntazo-approved-decisions: [PC-04, PC-09, PC-10, PC-11, PC-13, PC-14]
  x-puntazo-partial-decisions: [PC-12]
  x-puntazo-deferred: [PC-01, PC-03, PC-05, PC-06, PC-07, PC-08]
servers:
  - url: https://puntazo-preview.blakyta3d.duckdns.org/api/v1
    description: Staging VPS; el gateway web es el único servicio público
  - url: http://localhost:8080/v1
    description: Desarrollo local de API
security:
  - bearerAuth: []
tags:
  - name: Reseñas
    description: Invitaciones optativas a Google por compra confirmada y sucursal
  - name: Health
    description: Estado operativo y versión desplegada
  - name: Auth
    description: Identidad, sesiones y recuperación
  - name: Demo
    description: Alta gratuita controlada de comercios
  - name: Cuenta
    description: Perfil y ciclo de vida de la cuenta autenticada
  - name: Marcas
    description: Configuración comercial y personal
  - name: Clientes
    description: Clientes finales, tarjetas y saldos
  - name: Analíticas
    description: Resúmenes operativos autorizados
  - name: Movimientos
    description: Preview y confirmación transaccional del ledger
  - name: Facturación
    description: Suscripción mensual de la marca mediante Mercado Pago
  - name: Referidos
    description: Atribución de marcas y códigos compartibles
  - name: Backoffice
    description: Acceso exclusivo del equipo interno con MFA y cookie de sesión propia
paths:
  /health/live:
    get:
      tags: [Health]
      summary: Comprueba que el proceso está vivo
      operationId: getLiveness
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: El proceso está vivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /health/ready:
    get:
      tags: [Health]
      summary: Comprueba PostgreSQL, esquema, Redis y storage privado
      description: Valida conexión PostgreSQL, versión exacta de migración, disponibilidad del rate limiter Redis y acceso al bucket S3-compatible cuando media está habilitado.
      operationId: getReadiness
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: API, PostgreSQL, migración requerida, Redis y storage configurado están listos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /version:
    get:
      tags: [Health]
      summary: Informa versión de aplicación, commit y esquema
      operationId: getVersion
      security: []
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Versión desplegada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Registra exclusivamente una cuenta cliente final gratuita
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCustomerRequest' }
      responses:
        '201':
          description: Cliente creado sin suscripción; QR emitido y almacenado sólo como hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterCustomerEnvelope' }
        '403': { $ref: '#/components/responses/DemoSignupClosed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /marcas/{brand_id}/beneficios/{resource_id}:
    parameters: [{ $ref: '#/components/parameters/BrandId' }, { $ref: '#/components/parameters/ResourceId' }]
    get:
      tags: [Marcas]
      summary: Consulta un beneficio activo o archivado
      operationId: getBenefit
      x-puntazo-implementation: IMPLEMENTED
      responses: { '200': { description: Beneficio activo o inactivo, content: { application/json: { schema: { $ref: '#/components/schemas/BenefitEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      tags: [Marcas]
      summary: Reemplaza o reactiva un beneficio
      operationId: replaceBenefit
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReplaceBenefitRequest' } } } }
      responses: { '200': { description: Beneficio reemplazado o reactivado, content: { application/json: { schema: { $ref: '#/components/schemas/BenefitEnvelope' } } } }, '412': { description: Versión desactualizada } }
    patch:
      tags: [Marcas]
      summary: Actualiza parcialmente un beneficio
      operationId: patchBenefit
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBenefitRequest' } } } }
      responses: { '200': { description: Beneficio actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/BenefitEnvelope' } } } }, '412': { description: Versión desactualizada } }
    delete:
      tags: [Marcas]
      summary: Archiva lógicamente un beneficio
      operationId: deleteBenefit
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses: { '204': { description: Beneficio desactivado }, '412': { description: Versión desactualizada } }
  /auth/email-verification/request:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      summary: Solicita un correo sin revelar si la cuenta existe
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses:
        '202':
          description: Solicitud aceptada de forma genérica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/email-verification/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmailVerification
      summary: Consume una vez el token de verificación
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TokenRequest' } } } }
      responses:
        '200':
          description: Correo verificado; el usuario debe iniciar sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Solicita recuperación sin revelar si la cuenta existe
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EmailRequest' } } } }
      responses:
        '202':
          description: Solicitud aceptada de forma genérica
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      summary: Cambia la contraseña y revoca todas las sesiones
      security: []
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' } } } }
      responses:
        '200':
          description: Contraseña actualizada; requiere iniciar sesión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /demo/comercios:
    post:
      tags: [Demo]
      operationId: registerDemoMerchant
      summary: Alta atómica e idempotente de un propietario con programa Sellos o Puntos
      security: []
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDemoMerchantRequest' }
      responses:
        '201':
          description: Usuario, marca, propietario, sucursal y programa creados; onboarding continúa sin beneficio
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoMerchantEnvelope' }
        '403': { $ref: '#/components/responses/DemoSignupClosed' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia una sesión con email y contraseña verificados
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/google:
    post:
      tags: [Auth]
      operationId: loginGoogle
      summary: Inicia sesión o crea una cuenta elegida con un ID token de Google verificado
      description: |
        Para una cuenta existente basta `id_token`; `account_type` y `merchant_registration`
        se ignoran y nunca convierten la cuenta. Una identidad nueva debe indicar
        `CLIENTE_FINAL` o `PERSONAL_MARCA`. El alta `PERSONAL_MARCA` provisiona en una
        transacción la marca, membresía PROPIETARIO, sucursal, programa y acceso demo $0.
        Si una identidad Google verificada es nueva y omite `account_type`, no se crea
        usuario, sesión ni recurso comercial: se devuelve `422 ACCOUNT_TYPE_REQUIRED`
        con `details.next_action=SELECT_ACCOUNT_TYPE`, `details.profile={name,apellido}`
        y `details.missing_fields`. `given_name` y `family_name` provienen del token
        verificado; el cliente completa sólo campos faltantes. Si faltan letras en
        nombre o apellido al registrar, se devuelve `REGISTRATION_PROFILE_REQUIRED`.
        El login de una cuenta existente no exige completar esos campos. El cliente debe conservar el
        `id_token` sólo en memoria y reenviarlo después de la elección; si Google ya no
        lo valida, debe comenzar una autenticación nueva. El alias temporal
        `POST /auth/google` conserva este mismo error y reglas de selección.
      security: []
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthRequest' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '403': { $ref: '#/components/responses/DemoSignupClosed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/GoogleAuthValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rota el refresh token y emite una sesión nueva
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      x-puntazo-implementation: IMPLEMENTED
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTransportRequest' }
      responses:
        '200':
          description: Sesión rotada; el refresh token anterior queda invalidado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoca la sesión autenticada
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/ClientPlatform'
      responses:
        '204': { description: Sesión revocada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me:
    get:
      tags: [Cuenta]
      summary: Consulta la cuenta y sus membresías activas
      operationId: getCurrentUser
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Identidad y membresías restaurables en otro dispositivo
          headers:
            ETag:
              description: Versión fuerte para mutaciones con If-Match
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Cuenta]
      summary: Actualiza parcialmente el perfil con control de versión
      operationId: updateCurrentUser
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: Perfil actualizado
          headers:
            ETag:
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUserEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '412':
          description: If-Match ausente, inválido o desactualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Cuenta]
      operationId: anonymizeCurrentUser
      summary: Anonimiza la cuenta y preserva el ledger histórico
      description: >-
        Baja definitiva e irreversible una vez completada. Si el usuario es el
        último propietario activo de una marca, cancela primero sus cobros
        recurrentes y cierra marca, sucursales, membresías, códigos y tarjetas.
        Si queda otro propietario activo con cuenta activa, conserva la marca
        y su suscripción. No exige transferir propiedad. Una suscripción en
        preparación o un fallo del proveedor conserva la cuenta sin anonimizar.
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnonymizeAccountRequest' }
      responses:
        '202':
          description: Anonimización completada y accesos revocados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymizationEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: BILLING_IN_PROGRESS; suscripción en preparación pendiente de reconciliación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: BILLING_UNAVAILABLE o BILLING_PROVIDER_ERROR; baja sin completar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '412':
          description: If-Match ausente, inválido o desactualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /me/export:
    get:
      tags: [Cuenta]
      operationId: exportCurrentUserData
      summary: Exporta perfil, membresías, tarjetas propias y movimientos del actor
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Exportación JSON consistente de los datos autorizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExportEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me/foto:
    get:
      tags: [Cuenta]
      operationId: getCurrentUserPhoto
      summary: Entrega una URL temporal para la foto privada del perfil
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Foto disponible mediante URL firmada temporal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilePhotoEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Cuenta]
      operationId: uploadCurrentUserPhoto
      summary: Reemplaza la foto privada del perfil
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [archivo]
              properties:
                archivo: { type: string, format: binary, description: "JPEG, PNG o WebP de hasta 5 MiB" }
      responses:
        '200':
          description: Foto reemplazada y perfil versionado
          headers:
            ETag:
              schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfilePhotoUpdateEnvelope' }
        '412': { description: Versión desactualizada }
        '413': { description: La imagen supera 5 MiB }
        '415': { description: Formato de imagen no permitido }
  /marcas:
    get:
      tags: [Marcas]
      operationId: listMyBrands
      summary: Lista sólo marcas alcanzadas por la membresía del actor
      x-puntazo-implementation: IMPLEMENTED
      responses:
        '200':
          description: Marcas visibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantContextListEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /marcas/{brand_id}:
    get:
      tags: [Marcas]
      operationId: getMyBrand
      summary: Contexto Sellos de una marca propia
      x-puntazo-implementation: IMPLEMENTED
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          description: Marca, sucursal, programa, beneficio y acceso demo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantContextEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Marcas]
      summary: Actualiza parcialmente una marca
      operationId: updateBrand
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BrandId' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBrandRequest' } } } }
      responses: { '200': { description: Marca actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/MerchantContextEnvelope' } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '412': { description: Versión desactualizada } }
    delete:
      tags: [Marcas]
      summary: Desactiva lógicamente una marca y sus recursos activos
      operationId: deleteBrand
      x-puntazo-implementation: IMPLEMENTED
      parameters: [{ $ref: '#/components/parameters/BrandId' }, { $ref: '#/components/parameters/IfMatch' }]
      responses: { '204': { description: Marca desactivada }, '403': { $ref: '#/components/responses/Forbidden' }, '412': { description: Versión desactualizada } }
  /marcas/{brand_id}/sucursales:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    get:
      tags: [Marcas]
      summary: Lista sucursales según el alcance del rol
      operationId: listBranches
      x-puntazo-implementation: IMPLEMENTED
      responses: { '200': { description: Sucursales, content: { application/json: { schema: { $ref: '#/components/schemas/BranchListEnvelope' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      tags: [Marcas]
      summary: Crea una sucursal activa no principal
      operationId: createBranch
      x-puntazo-implementation: IMPLEMENTED
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateBranchRequest' } } } }
      responses: { '201': { description: Sucursal creada, content: { application/json: { schema: { $ref: '#/components/schemas/BranchEnvelope' } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /marcas/{brand_id}/sucursales/cotizacion:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    post:
      tags: [Marcas]
      operationId: quoteBranchProration
      summary: Cotiza el alta de una sucursal con precio contratado y días calendario
      description: Implementado en localhost. Requiere propietario y BRANCH_PRORATION_ENABLED; producción bloqueada hasta certificación.
      x-puntazo-implementation: IMPLEMENTED_LOCAL
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateBranchRequest' } } } }
      responses:
        '200': { description: Cotización inmutable, content: { application/json: { schema: { $ref: '#/components/schemas/BranchQuoteEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: QUOTE_CHANGED o suscripción no preparada }
        '503': { description: BILLING_UNAVAILABLE cuando la función está deshabilitada }
  /marcas/{brand_id}/sucursales/altas:
    parameters: [{ $ref: '#/components/parameters/BrandId' }]
    post:
      tags: [Marcas]
      operationId: confirmBranchProration
      summary: Reserva un alta idempotente sin activar la sucursal antes del pago
      x-puntazo-implementation: IMPLEMENTED_LOCAL
      parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [quote_id], properties: { quote_id: { type: string, format: uuid } } } } } }
      responses:
        '200': { description: Operación persistida, content: { application/json: { schema: { $ref: '#/components/schemas/BranchOperationEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'QUOTE_EXPIRED, QUOTE_CHANGED, IDEMPOTENCY_CONFLICT o IDEMPOTENCY_IN_PROGRESS' }
  /marcas/{brand_id}/sucursales/altas/{operation_id}:
    parameters: [{ $ref: '#/components/parameters/BrandId' }, { name: operation_id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Marcas]
      operationId: getBranchProrationOperation
      summary: Consulta y reconcilia el estado de pago del alta
      x-puntazo-implementation: IMPLEMENTED_LOCAL
      responses:
        '200': { description: Estado persistido, content: { application/json: { schema: { $ref: '#/components/schemas/BranchOperationEnvelope' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
